# Local cluster for fluke-operator.
#
# Core Dynamic Resource Allocation (DRA) is GA (resource.k8s.io/v1) as of
# Kubernetes 1.34 and needs no feature gate or --runtime-config on a >=1.34
# node image — only CDI support in containerd, enabled below. See the
# research behind this: docs/research/dra-mechanics.md on branch
# research/dra-mechanics, and issue #3 on the map (issue #1).
#
# Create with (image pinned from https://github.com/kubernetes-sigs/kind/releases):
#   kind create cluster --name fluke --config hack/kind-config.yaml \
#     --image kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
#
# Verify DRA is live:
#   kubectl get deviceclasses         # "No resources found" (not an error) = the API is being served
#   kubectl api-resources | grep resource.k8s.io
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
  # https://tags.cncf.io/container-device-interface#containerd-configuration
  # Lets the kubelet plugin (the eventual fluke DRA driver) inject devices
  # via CDI specs written to /var/run/cdi.
  - |-
    [plugins."io.containerd.grpc.v1.cri"]
      enable_cdi = true
nodes:
  - role: control-plane
  - role: worker # the fluke driver's DaemonSet will run on these
  - role: worker
